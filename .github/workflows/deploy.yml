name: Build and deploy to GitHub Pages

# Builds the Eleventy site (src/ -> _site/) and deploys it to GitHub Pages
# on every push to main. No local build step needed — push and it ships.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. cancel-in-progress is FALSE on purpose: cancelling
# an in-progress deploy makes the deploy-pages action report a FAILURE (and
# emails the repo owner). Queueing instead means a newer push waits its turn
# and both succeed. The queued run deploys slightly later; that is fine.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Build site
        run: npx @11ty/eleventy
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      # Whichever attempt actually deployed provides the URL.
      url: ${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      # GitHub's Pages deployment API intermittently rejects the first attempt
      # with "Deployment failed, try again later" (a ~9s hard reject, not a
      # timeout) and then succeeds on a plain rerun. Retry in-job so a single
      # transient reject never fails the run (or emails the owner). Attempts 1-2
      # tolerate failure; the final attempt is authoritative and only runs if
      # neither earlier one succeeded.
      - name: Deploy to GitHub Pages (attempt 1)
        id: deploy1
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Deploy to GitHub Pages (attempt 2)
        id: deploy2
        if: steps.deploy1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Deploy to GitHub Pages (final attempt)
        id: deployment
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v4
